<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-label="Pedro Gontijo - Unity Developer, Shader and VFX Artist">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".3" stop-color="#1b3a8a"/>
      <stop offset=".55" stop-color="#36bcf7"/>
      <stop offset=".78" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <pattern id="bands" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="46" height="120" fill="#ffffff" opacity=".10"/>
      <rect x="70" width="10" height="120" fill="#0b1026" opacity=".35"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity=".22"/>
    </pattern>
    <filter id="warp" x="-15%" y="-25%" width="130%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="18s" values="0.006 0.018;0.011 0.030;0.006 0.018" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="c"><rect width="840" height="220" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="840" height="220" fill="#0b1026"/>
    <g filter="url(#warp)">
      <rect x="-120" y="-120" width="1080" height="460" fill="url(#g)"/>
      <rect x="-120" y="-120" width="1080" height="460" fill="url(#bands)"/>
    </g>
    <rect width="840" height="220" fill="url(#fade)"/>
    <rect width="840" height="220" fill="url(#scan)"/>
    <text x="28" y="38" font-family="Consolas, Courier New, monospace" font-size="14" fill="#c0caf5" opacity=".9">Shader "Profile/HideOnChimes"</text>
    <text x="420" y="122" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="5" fill="#ffffff">PEDRO GONTIJO</text>
    <text x="420" y="160" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" fill="#e6f6ff">Unity Developer  ·  Shader &amp; VFX Artist  ·  Game Dev</text>
    <text x="812" y="200" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="13" fill="#c0caf5" opacity=".8">_Time.y<tspan fill="#36bcf7"> ▮<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
